name: Build release and deploy to Itch

run-name: Build and deploy ${{ github.ref_name }}

on:
  push:
    # Pattern matched against refs/tags
    tags:
      - '*' # Push events to every tag not containing /

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: PoIAna
  WIN64_RELEASE_FILENAME: PoIAna.windows-x86_64.zip
  WIN32_RELEASE_FILENAME: PoIAna.windows-x86_32.zip
  LINUX64_RELEASE_FILENAME: PoIAna.linux-x86_64.zip
  ANDROID_RELEASE_FILENAME: PoIAna.android.apk

jobs:
  build-export-butler:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:mono-4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          lfs: true
      - name: .NET installation
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"
      - name: Setup Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/poiana-release.keystore
          chmod 600 /tmp/poiana-release.keystore
      - name: Setup export templates for GitHub
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: Export Builds
        run: |
          mkdir -v -p build/win64
          mkdir -v -p build/win32
          mkdir -v -p build/linux
          
          godot --headless --verbose --export-release "Windows Desktop x86_64" build/win64/$EXPORT_NAME.exe
          godot --headless --verbose --export-release "Windows Desktop x86_32" build/win32/$EXPORT_NAME.exe
          godot --headless --verbose --export-release "Linux/X11" build/linux/$EXPORT_NAME.x86_64
      - name: Godot Icon
        run: |
          wget https://raw.githubusercontent.com/pkowal1982/godoticon/master/ReplaceIcon.gd
          godot --headless -s ReplaceIcon.gd icon.ico build/win64/$EXPORT_NAME.exe
      - name: Calculate Android version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: $GITHUB_REF_NAME"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          MAJOR=$((10#$MAJOR))
          MINOR=$((10#$MINOR))
          PATCH=$((10#$PATCH))

          if (( MINOR >= 1000 || PATCH >= 1000 )); then
            echo "Minor and patch must be below 1000"
            exit 1
          fi

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          if (( VERSION_CODE <= 0 || VERSION_CODE > 2100000000 )); then
            echo "Invalid Android versionCode: $VERSION_CODE"
            exit 1
          fi

          echo "ANDROID_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "Android version: $VERSION"
          echo "Android versionCode: $VERSION_CODE"
      - name: Set Android version
        shell: bash
        run: |
          FILE="export_presets.cfg"

          CODE_COUNT=$(grep -c '^version/code=' "$FILE" || true)
          NAME_COUNT=$(grep -c '^version/name=' "$FILE" || true)

          if [[ "$CODE_COUNT" -ne 1 || "$NAME_COUNT" -ne 1 ]]; then
            echo "Unexpected Android version configuration"
            exit 1
          fi

          sed -i \
            "s/^version\/code=.*/version\/code=$ANDROID_VERSION_CODE/" \
            "$FILE"

          sed -i \
            "s|^version/name=.*|version/name=\"$ANDROID_VERSION_NAME\"|" \
            "$FILE"

          grep -E '^version/(code|name)=' "$FILE"
      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/poiana-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android

          godot --headless --verbose \
            --export-release "Android" \
            build/android/$ANDROID_RELEASE_FILENAME

          test -s build/android/$ANDROID_RELEASE_FILENAME
      - name: Zip releases
        run: |
          cd build/win64
          zip -r $WIN64_RELEASE_FILENAME *
          cd ../win32
          zip -r $WIN32_RELEASE_FILENAME *
          cd ../linux
          chmod +x $EXPORT_NAME.x86_64
          zip -r $LINUX64_RELEASE_FILENAME *
          cd ../..
          mv build/win64/$WIN64_RELEASE_FILENAME .
          mv build/win32/$WIN32_RELEASE_FILENAME .
          mv build/linux/$LINUX64_RELEASE_FILENAME .
      - name: Create release ${{ github.ref_name }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.WIN64_RELEASE_FILENAME }}, ${{ env.WIN32_RELEASE_FILENAME }}, ${{ env.LINUX64_RELEASE_FILENAME }}, build/android/${{ env.ANDROID_RELEASE_FILENAME }}"
      - name: Publish Windows to Itch.io with Butler
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: windows
          ITCH_GAME: poiana
          ITCH_USER: ivanrava
          PACKAGE: ${{ env.WIN64_RELEASE_FILENAME }}
          VERSION: ${{ github.ref_name }}
      - name: Publish Linux to Itch.io with Butler
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: linux
          ITCH_GAME: poiana
          ITCH_USER: ivanrava
          PACKAGE: ${{ env.LINUX64_RELEASE_FILENAME }}
          VERSION: ${{ github.ref_name }}
      - name: Publish Android to Itch.io with Butler
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: android
          ITCH_GAME: poiana
          ITCH_USER: ivanrava
          PACKAGE: build/android/${{ env.ANDROID_RELEASE_FILENAME }}
          VERSION: ${{ github.ref_name }}
